# Builds and publishes a release when a version tag (v1.2.3) is pushed. The tag must match the version in the root
# build.gradle.kts. Release notes come from .github/release-notes/<tag>.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Check that the tag matches the project version
        run: |
          version=$(sed -n 's/^val releaseVersion = "\(.*\)"$/\1/p' build.gradle.kts)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          test -f ".github/release-notes/$GITHUB_REF_NAME.md"
      # All tests and server GameTests, the mod JAR and the CLI distribution.
      - run: ./gradlew build :filascript-cli:installDist --console=plain
      - name: Run the installed CLI
        run: ./filascript-cli/build/install/filascript-cli/bin/filascript-cli run examples/hello.fsig | grep -q 'Hello, FilaScript!'
      - name: Collect artifacts and checksums
        run: |
          mkdir dist
          cp filasignal-fabric/build/libs/filasignal-"$VERSION"+mc*.jar dist/
          cp filascript-cli/build/distributions/filascript-cli-"$VERSION".zip dist/
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "FilaSignal $GITHUB_REF_NAME"
          --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
          --verify-tag
