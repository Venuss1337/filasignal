name: Bug report
description: Something in FilaSignal or FilaScript does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security problems, do not open an issue; see SECURITY.md.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: FilaSignal, Minecraft, Fabric Loader, Fabric API and Java versions, and other mods if relevant.
      placeholder: FilaSignal 1.0.0, Minecraft 26.3, Loader 0.20.1, Fabric API 0.166.2+26.3, Java 25
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options: [Single player, Dedicated server, Both, Standalone CLI]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the FilaScript program if one is involved.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log or crash report
      description: The relevant part of logs/latest.log or the crash report.
      render: text
