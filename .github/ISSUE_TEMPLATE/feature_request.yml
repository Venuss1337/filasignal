name: Feature request
description: Suggest an improvement to the mod, the language or the documentation.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The situation or automation you have in mind, and what is missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How it could work, for example an API or a program you would like to write.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
